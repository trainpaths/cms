server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Images only from own origin: uploads are served by the API (/api/public/media).
    # Inherited by locations below only while none uses add_header.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Path forwarded unchanged, mirrors Vite dev proxy.
    location /api/ {
        client_max_body_size 64k;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Page writes carry whole block trees; the API allows 2 MB here (PagesController).
    location /api/pages {
        client_max_body_size 2m;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Menu writes carry the whole item tree; the API allows 512 KB (MenusController).
    location /api/menus {
        client_max_body_size 512k;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media uploads; the API allows 10 MB files (MediaService.MaxUploadBytes).
    location = /api/media {
        client_max_body_size 11m;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backup archives (DB + media): uploads up to the API's Backup:MaxUploadMegabytes (2 GB), streamed through;
    # a restore or backup can take minutes.
    location /api/backups {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output never changes.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Public pages: server-rendered HTML from the API (PublicHtmlController). For app routes (/login,
    # /admin, ... = PageService.ReservedSlugs) and pages without current HTML it answers with
    # X-Accel-Redirect: /index.html (admin SPA) or /public.html (client-rendered shell), served below.
    # `/` → /api/public/html/ (home)
    location ~* "^/[a-z0-9-]*$" {
        rewrite ^/(.*)$ /api/public/html/$1 break;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — let vue-router handle client-side routes.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
