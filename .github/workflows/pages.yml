# Push to main → build the browser-only demo (playground/demo/: the editor + view of one page against an in-browser
# mock of the API, kept in localStorage) and deploy it to GitHub Pages (https://trainpaths.github.io/cms/).
# Relative asset URLs (base './' in vite.demo.config.ts) and hash routes: works under /cms/ without a 404.html.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:demo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: playground/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
