name: CI

# A green run on main triggers the release (release.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (dotnet test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore api-backend/Tests/Tests.csproj

      - name: Check for vulnerable packages
        run: |
          dotnet list api-backend/Tests/Tests.csproj package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

      - name: Build
        run: dotnet build api-backend/Tests/Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test --project api-backend/Tests/Tests.csproj -c Release --no-build

      - name: Check OpenAPI contract is up to date
        run: git diff --exit-code frontend/openapi/swagger.json

  frontend:
    name: Frontend (lint / typecheck / build / e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Throwaway secrets; e2e runs every test from one IP, so the per-IP limits are raised.
      - name: Configure environment
        run: |
          cp .env.example .env
          sed -i "s|^API_JWT_KEY=.*|API_JWT_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^S3_SECRET_KEY=.*|S3_SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^RATE_LIMIT_PERMIT=.*|RATE_LIMIT_PERMIT=10000|" .env
          sed -i "s|^RATE_LIMIT_GENERAL_PERMIT=.*|RATE_LIMIT_GENERAL_PERMIT=10000|" .env
          sed -i "s|^RATE_LIMIT_PAGES_PERMIT=.*|RATE_LIMIT_PAGES_PERMIT=10000|" .env
          # Bootstrap super admin: the editor e2e specs log in as this staff account.
          sed -i "s|^BOOTSTRAP_SUPERADMIN_EMAIL=.*|BOOTSTRAP_SUPERADMIN_EMAIL=e2e-admin@test.local|" .env
          sed -i "s|^BOOTSTRAP_SUPERADMIN_PASSWORD=.*|BOOTSTRAP_SUPERADMIN_PASSWORD=e2e-admin-password|" .env

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # pnpm workspace: frontend/ (@trainpaths/cms package) + playground/ (instance app, e2e)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      # The package ships the generated client (instances don't run hey-api): it must match swagger.json
      - name: Check generated API client is up to date
        run: |
          pnpm gen-api
          git add -N frontend/src/api
          git diff --exit-code frontend/src/api

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:front

      - name: Build & start stack
        run: docker compose up -d --build frontend renderer

      - name: Wait for frontend
        run: timeout 180 bash -c 'until curl -sf http://localhost:5173/; do sleep 5; done'

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: playground
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: playground
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          E2E_STAFF_EMAIL: e2e-admin@test.local
          E2E_STAFF_PASSWORD: e2e-admin-password
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playground/playwright-report/
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose down
